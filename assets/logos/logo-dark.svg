<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 72" width="380" height="72" fill="none">
  <defs>
    <!-- Brand Signature Gradient from Official Logo -->
    <linearGradient id="logoDarkBrandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9E58DB"/>
      <stop offset="52%" stop-color="#C465A8"/>
      <stop offset="100%" stop-color="#EC8670"/>
    </linearGradient>
  </defs>

  <!-- Left: Signature Gradient Badge with Authentic MW Monogram -->
  <g transform="translate(6, 6)">
    <rect width="60" height="60" rx="15" fill="url(#logoDarkBrandGrad)" filter="drop-shadow(0 4px 12px rgba(158, 88, 219, 0.25))"/>
    
    <!-- White Intertwined MW Ring Icon -->
    <g transform="translate(8, 7) scale(0.36)" fill="none" stroke="#FFFFFF" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 45 15 C 20 15, 6 36, 14 62 C 20 78, 38 92, 58 92" stroke-width="9"/>
      <path d="M 75 92 C 100 92, 114 71, 106 45 C 100 29, 82 15, 62 15" stroke-width="9"/>
      <path d="M 22 72 L 40 28 L 60 58 L 80 28 L 98 72" stroke-width="9"/>
    </g>
  </g>

  <!-- Right: Official Typography -->
  <g transform="translate(78, 12)">
    <text x="0" y="24" font-family="'Montserrat', sans-serif" font-size="20" font-weight="700" letter-spacing="3.2" fill="#151318">MIRACLE</text>
    <text x="0" y="44" font-family="'Montserrat', sans-serif" font-size="15" font-weight="600" letter-spacing="4.8" fill="#C465A8">WEDDINGS</text>
    <text x="145" y="44" font-family="'Montserrat', sans-serif" font-size="7.5" font-weight="500" letter-spacing="2.2" fill="#9E58DB" opacity="0.9">PHOTOGRAPHY</text>
  </g>
</svg>
